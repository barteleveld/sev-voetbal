name: Vernieuw volledige nieuwsreserve

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sev-news-reserve
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run news:refresh
      - run: npm test
      - name: Bewaar uitsluitend de gecontroleerde nieuwsindexen
        run: |
          git add lib/news-snapshot.json lib/investment-news-snapshot.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Vernieuw volledige SEV-nieuwsreserve'
          # Never force-push: concurrent changes must not be overwritten.
          git push
